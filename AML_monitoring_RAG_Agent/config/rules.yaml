# Versioned Compliance Rules and Thresholds
version: 1.1.0
effective_date: "2026-08-06"

rules:
  - rule_id: "RULE-001a"
    description: "Large Transaction Amount (> $10,000)"
    condition: "amount > 10000"
    weight: 25
    tier_contribution: "MEDIUM"
    regulatory_ref: "FATF Recommendation 10"

  - rule_id: "RULE-001b"
    description: "High Value Transfer (> $50,000)"
    condition: "amount > 50000"
    weight: 20
    tier_contribution: "HIGH"
    regulatory_ref: "FATF Recommendation 10"

  - rule_id: "RULE-001c"
    description: "Major Value Transfer (> $100,000)"
    condition: "amount > 100000"
    weight: 20
    tier_contribution: "HIGH"
    regulatory_ref: "FATF Recommendation 10"

  - rule_id: "RULE-001d"
    description: "Ultra-High Value Transfer (> $250,000)"
    condition: "amount > 250000"
    weight: 20
    tier_contribution: "CRITICAL"
    regulatory_ref: "FATF Recommendation 10"

  - rule_id: "RULE-002"
    description: "Physical Cash Currency Transaction (CTR Threshold)"
    condition: "payment_format == 'Cash'"
    weight: 35
    tier_contribution: "HIGH"
    regulatory_ref: "FATF Recommendation 20"

  - rule_id: "RULE-003"
    description: "Cryptocurrency / Virtual Asset Settlement"
    condition: "payment_currency == 'Bitcoin' or receiving_currency == 'Bitcoin'"
    weight: 25
    tier_contribution: "MEDIUM"
    regulatory_ref: "FATF Recommendation 15 (Virtual Assets)"

  - rule_id: "RULE-004"
    description: "Ground-Truth Laundering Pattern Indicator (is_laundering = 1)"
    condition: "is_laundering == 1"
    weight: 85
    tier_contribution: "CRITICAL"
    regulatory_ref: "Internal Suspicious Activity Baseline"

tier_thresholds:
  high: 60
  medium: 35
  low: 0
